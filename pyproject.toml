[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wirewizard-gui"
version = "0.1.0"
description = "Desktop editor for WireViz wiring harness projects"
readme = "README.md"
requires-python = ">=3.10.1,<3.15"
license = "GPL-3.0-only"
authors = [
  { name = "WireWizardGUI contributors" },
]
dependencies = [
  "PySide6==6.11.1",
  "PyYAML==6.0.3",
  "Wireviz==0.4.1",
  "click==8.4.2",
  "graphviz==0.21",
  "Pillow==12.3.0",
]

[project.gui-scripts]
wirewizardgui = "wirewizard_gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wirewizard_gui*"]
namespaces = true
